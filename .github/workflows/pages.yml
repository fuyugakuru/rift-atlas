name: Publish Rift Atlas

on:
  push:
    branches: [main]
    paths-ignore:
      - "site-bundle.part*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Import initial website once
        shell: bash
        run: |
          if [ ! -f site-bundle.part01 ]; then
            test -s index.html
            echo 'Website source is ready.'
            exit 0
          fi

          cat site-bundle.part* > "$RUNNER_TEMP/site-bundle.zip"
          expected=$(cut -d ' ' -f 1 site-bundle.sha256)
          echo "$expected  $RUNNER_TEMP/site-bundle.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/site-bundle.zip" -d .
          test -s index.html
          test -d assets

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' '*.css' '*.js' '*.svg' '*.json' '*.md' '*.cmd' assets tools .nojekyll .editorconfig .prettierrc.json
          git rm -- site-bundle.part* site-bundle.sha256
          git commit -m 'Import latest Rift Atlas website'
          git push origin HEAD:main

  deploy:
    needs: import
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - name: Apply editable skin video links
        shell: bash
        run: |
          if [ -f "Видео скинов.json" ] && [ -f tools/update-skin-videos.cjs ]; then
            node tools/update-skin-videos.cjs
          fi

      - name: Prepare public website
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          cp -- *.html *.css *.js *.svg "$RUNNER_TEMP/website/"
          cp -R assets "$RUNNER_TEMP/website/assets"
          touch "$RUNNER_TEMP/website/.nojekyll"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
