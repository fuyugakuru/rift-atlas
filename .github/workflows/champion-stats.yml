name: Refresh CN champion statistics
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate Tencent snapshot
        run: node tools/update-champion-stats.cjs
      - name: Save successful snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add champion-stats.json champion-stats-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh CN champion statistics'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          cp -- *.html *.css *.js *.svg sitemap.xml champion-stats.json champion-stats-history.json "$RUNNER_TEMP/website/"
          cp -R assets "$RUNNER_TEMP/website/assets"
          touch "$RUNNER_TEMP/website/.nojekyll"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/website
      - uses: actions/deploy-pages@v4
        id: deployment
